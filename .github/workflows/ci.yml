name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hive_sight_advisor
          POSTGRES_PASSWORD: hive_sight_advisor
          POSTGRES_DB: hive_sight_advisor_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hive_sight_advisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install advisor-api
        working-directory: services/advisor-api
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: services/advisor-api
        run: python -m pytest -v

      - name: Run ruff
        working-directory: services/advisor-api
        run: python -m ruff check .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web
        run: pnpm check:web

      - name: Run Vitest
        run: pnpm test:web

  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hive_sight_advisor
          POSTGRES_PASSWORD: hive_sight_advisor
          POSTGRES_DB: hive_sight_advisor_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hive_sight_advisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create advisor-api venv
        run: python3.12 -m venv .venv-advisor-api

      - name: Install advisor-api into venv
        working-directory: services/advisor-api
        run: ../../.venv-advisor-api/bin/pip install -e ".[dev]"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright + Gherkin acceptance suite
        working-directory: apps/web
        run: pnpm test:acceptance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
