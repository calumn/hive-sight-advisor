services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hive_sight_advisor
      POSTGRES_PASSWORD: hive_sight_advisor
      POSTGRES_DB: hive_sight_advisor_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive_sight_advisor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
