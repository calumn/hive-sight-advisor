- id: f9655b90-24c2-4fb9-a60a-db9b6ebff73e
  jurisdiction_code: us
  title: Formic Pro Varroa Treatment
  source: "Foxhound Bee Company \u2014 product information"
  source_url: https://www.foxhoundbeecompany.com/products/formic-pro
  licence_terms: All rights reserved (retailer product literature)
  passage_id: add1d19b-d8a6-447d-b7fc-e314921419e7
  passage_text: Formic Pro is a US EPA-registered Varroa treatment using formic acid
    in slow-release strips placed across the top bars of the brood nest. It requires
    daytime temperatures between fifty and eighty-five degrees Fahrenheit for optimal
    results, and unlike synthetic acaricides, it can be used during a honey flow since
    it leaves no residue and honey supers do not need to be removed. Two strips are
    typically applied together for a fourteen-day treatment, or one strip followed
    by a second after ten days for a twenty-day treatment. As an organic acid, Formic
    Pro is approved for use in organic beekeeping operations.
- id: 79f6cc6c-b715-48ae-a02d-83f385ea4ed1
  jurisdiction_code: us
  title: HopGuard 3 Varroa Treatment
  source: "Mann Lake Bee & Ag Supply \u2014 product information"
  source_url: https://www.mannlakeltd.com/feeding-medications/hopguard-3/
  licence_terms: All rights reserved (retailer product literature)
  passage_id: 2aed4540-4336-4a72-a89e-42a556c10655
  passage_text: "HopGuard 3 is a US EPA-registered Varroa treatment based on hop beta\
    \ acids, applied as strips hung between the brood frames \u2014 two strips per\
    \ brood chamber, roughly one strip per five frames of bees. It requires daytime\
    \ temperatures above fifty degrees Fahrenheit and, unlike amitraz or thymol strips,\
    \ is labelled safe to use during a honey flow, so honey supers can stay on the\
    \ hive during treatment. Strips are typically left in place for up to forty-two\
    \ days, not exceeding fifty-six days. The active ingredient is naturally derived\
    \ from hops, though the product is not an officially certified organic treatment."
- id: 37163c34-e87f-439f-8cf8-333a8a3edbc9
  jurisdiction_code: us
  title: Api-Bioxal Oxalic Acid Varroa Treatment
  source: "Mann Lake Bee & Ag Supply — product information"
  source_url: https://www.mannlakeltd.com/feeding-medications/api-bioxal-oxalic-acid-/
  licence_terms: All rights reserved (retailer product literature)
  passage_id: 1caee93c-f7ab-43c5-8525-069ba2d8034c
  passage_text: Api-Bioxal is a US EPA-registered oxalic acid dihydrate treatment
    (97% oxalic acid dihydrate, 3% inert ingredients). As of 2026, it is the only
    oxalic acid product registered with the EPA for Varroa treatment in the United
    States. It can be applied as a sugar syrup dribble, as a vaporized fumigant, or
    as a spray on package bees. Oxalic acid works best during low-brood or broodless
    periods, since it does not penetrate capped brood cells, and unlike many synthetic
    acaricides it can be used with honey supers on the hive. Oxalic acid is a naturally
    occurring organic acid and is approved for use under USDA National Organic Program
    standards for organic beekeeping operations.
