[project]
name = "hive-sight-advisor-api"
version = "0.1.0"
description = "Advisor API: grounded query answering over a seeded corpus."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "anthropic>=0.40,<1.0",
  "voyageai>=0.3,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pyyaml>=6.0,<7.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-bdd>=8.0,<9.0",
  "ruff>=0.8,<1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_sight_advisor_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
